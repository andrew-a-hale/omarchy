# Application bindings
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser
$webapp = omarchy-launch-webapp
$pi = vncviewer 192.168.1.24

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, R, Pi, exec, $pi
bindd = SUPER, D, Vesktop, exec, uwsm app -- vesktop
bindd = SUPER, S, Steam, exec, uwsm app -- steam
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, chromium --profile-directory="Profile 4"
bindd = SUPER, N, Neovim, exec, $terminal -e nvim
bindd = SUPER, A, Activity, exec, $terminal -e btop

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, M, Music, exec, $webapp "https://music.youtube.com/"
bindd = SUPER, C, ChatGPT, exec, $webapp "https://chatgpt.com"
bindd = SUPER, Y, YouTube, exec, $webapp "https://youtube.com/"
bindd = SUPER, T, Twitch, exec, $webapp "https://twitch.com/"

